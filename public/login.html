<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TTCS Team 04</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">

            <div class="logo">
                <div class="logo-icon">🏠</div>
                <h1>TTCS Team 04</h1>
                <p>Hệ thống quản lý HomeStay</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Nhập tên đăng nhập"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Nhập mật khẩu"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <div class="login-options">
                    <label>
                        <input type="checkbox" id="rememberMe">
                        Ghi nhớ đăng nhập
                    </label>

                    <a href="#" id="forgotPassword">
    Quên mật khẩu?
</a>

<div id="forgotPasswordForm" class="forgot-password-form" style="display: none;">

    <h3>Đặt lại mật khẩu</h3>

    <div class="form-group">
        <label for="resetEmail">Email</label>
        <input
            type="email"
            id="resetEmail"
            placeholder="Nhập email của bạn"
        >
    </div>

    <button type="button" id="sendOtpButton" class="login-button">
        Gửi mã OTP
    </button>

    <div id="otpSection" style="display: none;">

        <div class="form-group">
            <label for="resetOtp">Mã OTP</label>
            <input
                type="text"
                id="resetOtp"
                placeholder="Nhập mã OTP 6 số"
                maxlength="6"
            >
        </div>

        <div class="form-group">
            <label for="newPassword">Mật khẩu mới</label>
            <input
                type="password"
                id="newPassword"
                placeholder="Nhập mật khẩu mới"
            >
        </div>

        <button type="button" id="resetPasswordButton" class="login-button">
            Đặt lại mật khẩu
        </button>

    </div>

    <div id="forgotMessage" class="message"></div>

</div>
                </div>

                <button type="submit" class="login-button">
                    Đăng nhập
                </button>

                <div id="message" class="message"></div>

            </form>

            <div class="register-link">
                Chưa có tài khoản?
                <a href="#">Đăng ký ngay</a>
            </div>

        </div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt lại mật khẩu | Homestay Việt</title><link rel="stylesheet" href="/css/homestay-ui.css"><link rel="stylesheet" href="/css/shell.css"><link rel="stylesheet" href="/css/travel-ui.css"><script src="/js/common.js" defer></script><script src="/js/shell.js" defer></script><script src="/js/account.js" defer></script></head><body class="homestay-ui"><a class="skip-link" href="#main">Đến nội dung chính</a><main class="container" id="main"><div class="login-wrap"><section class="card"><h1>Đặt lại mật khẩu</h1><p>Mã đã được yêu cầu gửi tới <strong id="reset-email"></strong>. Kiểm tra hộp thư và thư rác. Mã hết hạn sau 10 phút; tối đa 5 lần nhập sai.</p><form id="account-form" class="stack section-gap"><div class="field"><label for="code">Mã xác nhận 6 số</label><input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required></div><div class="field"><label for="password">Mật khẩu mới (từ 8 ký tự, có chữ và số)</label><input id="password" name="password" type="password" required autocomplete="new-password"></div><div class="field"><label for="confirmPassword">Nhập lại mật khẩu</label><input id="confirmPassword" name="confirmPassword" type="password" required autocomplete="new-password"></div><p id="account-error" class="notice error" role="alert" hidden></p><p id="account-success" class="notice" role="status" hidden></p><button class="btn primary">Lưu mật khẩu mới</button><button id="resend-code" class="btn secondary" type="button">Gửi lại mã</button></form><p><a href="/forgot-password.html">Đổi email nhận mã</a> · <a href="/login.html">Đăng nhập</a></p></section></div><footer class="footer"></footer></main></body></html>

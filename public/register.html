<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký | Homestay Việt</title><link rel="stylesheet" href="/css/homestay-ui.css"><link rel="stylesheet" href="/css/shell.css"><link rel="stylesheet" href="/css/travel-ui.css"><script src="/js/common.js" defer></script><script src="/js/shell.js?v=context-fix-20261019-r12" defer></script><script src="/js/booking-return.js?v=public-ai-20261018" defer></script><script src="/js/account.js?v=context-fix-20261019-r12" defer></script></head><body class="homestay-ui"><a class="skip-link" href="#main">Đến nội dung chính</a><main class="container" id="main"><div class="login-wrap"><section class="card"><h1>Tạo tài khoản</h1><p>Lưu thông tin và theo dõi các booking của bạn.</p><form id="account-form" class="stack section-gap"><div class="field"><label for="fullName">Họ và tên</label><input id="fullName" name="fullName" type="text" required autocomplete="name"></div><div class="field"><label for="username">Tên tài khoản (3–30 ký tự)</label><input id="username" name="username" type="text" required autocomplete="username"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="phone">Điện thoại</label><input id="phone" name="phone" type="tel"  autocomplete="tel"></div><div class="field"><label for="password">Mật khẩu (từ 8 ký tự, có chữ và số)</label><input id="password" name="password" type="password" required autocomplete="new-password"></div><div class="field"><label for="confirmPassword">Nhập lại mật khẩu</label><input id="confirmPassword" name="confirmPassword" type="password" required autocomplete="new-password"></div><p id="account-error" class="notice error" role="alert" hidden></p><p id="account-success" class="notice" role="status" hidden></p><button class="btn primary">Đăng ký</button></form><p>Đã có tài khoản? <a href="/login.html">Đăng nhập</a></p></section></div><footer class="footer"></footer></main></body></html>

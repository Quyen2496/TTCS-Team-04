<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập | Homestay Việt</title><link rel="stylesheet" href="/css/homestay-ui.css"><link rel="stylesheet" href="/css/shell.css"><link rel="stylesheet" href="/css/travel-ui.css"><script src="/js/common.js" defer></script><script src="/js/shell.js" defer></script><script src="/js/account.js" defer></script></head><body class="homestay-ui"><a class="skip-link" href="#main">Đến nội dung chính</a><main class="container" id="main"><div class="login-wrap"><section class="card"><h1>Chào mừng trở lại</h1><p>Đăng nhập để theo dõi kỳ nghỉ hoặc làm việc tại homestay.</p><form id="account-form" class="stack section-gap"><div class="field"><label for="username">Tên tài khoản hoặc email</label><input id="username" name="username" type="text" required autocomplete="username"></div><div class="field"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" required autocomplete="current-password"></div><p id="account-error" class="notice error" role="alert" hidden></p><p id="account-success" class="notice" role="status" hidden></p><button class="btn primary">Đăng nhập</button></form><div class="actions"><a href="/register.html">Tạo tài khoản</a><a href="/forgot-password.html">Quên mật khẩu?</a></div></section></div><footer class="footer"></footer></main></body></html>

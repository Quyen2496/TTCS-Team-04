<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập nhân viên | Homestay</title><link rel="stylesheet" href="/css/homestay-ui.css"><link rel="stylesheet" href="/css/shell.css"><script src="/js/common.js" defer></script><script src="/js/shell.js" defer></script><script src="/js/login.js" defer></script></head><body class="homestay-ui"><a class="skip-link" href="#main">Đến nội dung chính</a><main class="container" id="main"><div class="login-wrap"><section class="card"><span class="eyebrow">DÀNH CHO NHÂN VIÊN</span><h1>Chào mừng trở lại</h1><p>Đăng nhập để quản lý Homestay.</p><form class="stack section-gap" id="login-form"><div class="field"><label for="username">Tên tài khoản</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div class="notice error" id="login-error" role="alert" hidden></div><button class="btn primary" type="submit">Đăng nhập</button></form><p class="admin-note">Quên mật khẩu? Quản trị viên có thể cấp mật khẩu mới trong mục Tài khoản.</p></section></div><footer class="footer"><strong>Homestay</strong><span>Không gian ấm cúng · Trải nghiệm an tâm</span></footer></main></body></html>
